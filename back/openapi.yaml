paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: authLogin
      summary: Login com nome de usuário ou e-mail
      description: Grava os cookies `_tk` e `_rtk`. Na primeira vez cria a `apiKey` do usuário.
      security: []
      x-load-weight: pesado
      x-load-note: argon2id na verificação de senha; rate limit de 10 falhas/15 min por IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome_usuario, senha]
              properties:
                nome_usuario:
                  type: string
                  description: Nome de usuário ou e-mail.
                senha:
                  type: string
                  format: password
            example:
              nome_usuario: mariana.souza
              senha: Cr0n0#Track2026
      responses:
        '200':
          description: Autenticado.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetAuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              example:
                error: false
                message: Bem-vindo!
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '"Dados inválidos."'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '"Login ou senha inválidos."'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/register:
    post:
      tags: [auth]
      operationId: authRegister
      summary: Registrar usuário
      security: []
      x-load-weight: pesado
      x-load-note: Hash argon2id; rate limit 10/h por IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome_usuario, senha, nome_completo, email]
              properties:
                nome_usuario:
                  type: string
                senha:
                  type: string
                  format: password
                nome_completo:
                  type: string
                email:
                  type: string
                  format: email
                identificador:
                  type: string
                  description: Ignorado pelo controller.
            example:
              nome_usuario: mariana.souza
              senha: Cr0n0#Track2026
              nome_completo: Mariana Souza
              email: mariana.souza@sinosbyte.com.br
      responses:
        '201':
          description: Registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              example:
                error: false
                message: Usuário registrado com sucesso.
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '"Dados inválidos." ou "O nome de usuário ou e-mail já está em uso."'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/refresh-token:
    post:
      tags: [auth]
      operationId: authRefreshToken
      summary: Rotacionar o refresh token e emitir novo `_tk`
      security:
        - refreshCookie: []
      x-load-weight: escrita
      x-load-note: Revoga o refresh atual e cria outro em transação; rate limit 120/15 min por IP.
      responses:
        '200':
          description: Tokens renovados.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetAuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              example:
                error: false
                message: Token atualizado.
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '"Refresh token inválido." (cookie ausente).'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '"Refresh token inválido." (revogado, expirado ou usuário inativo).'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
          description: Inclui a corrida de rotação concorrente do mesmo refresh.
  /auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      summary: Encerrar a sessão atual
      description: Revoga só o refresh enviado (outros dispositivos seguem logados) e limpa os cookies.
      security:
        - {}
        - refreshCookie: []
      x-load-weight: escrita
      responses:
        '200':
          description: Sessão encerrada.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearAuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              example:
                error: false
                message: Logout realizado.
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/password-reset:
    post:
      tags: [auth]
      operationId: authPasswordReset
      summary: Enviar código de recuperação de senha por e-mail
      description: Código de 8 caracteres hexadecimais guardado em memória por 5 minutos (perdido em restart).
      security: []
      x-load-weight: escrita
      x-load-note: Envia e-mail real pelo Resend; não incluir no mix sem sandbox. Rate limit 5/15 min por IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                reset:
                  type: boolean
            example:
              email: mariana.souza@sinosbyte.com.br
              reset: true
      responses:
        '200':
          description: Código enviado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              example:
                error: false
                message: Código de recuperação enviado para o e-mail cadastrado.
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '"E-mail inválido ou não fornecido."'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '"Este e-mail não pertence a nenhum usuário."'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
          description: Inclui falha no envio do e-mail.
  /auth/password-reset-verify:
