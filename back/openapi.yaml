openapi: 3.1.0
info:
  title: ChronoTracker API
  version: 1.0.0
  license:
    name: Proprietária
    identifier: LicenseRef-Proprietary
  summary: API de controle de horas, despesas e eventos administrativos do ChronoTracker.
  description: |
    Gerado a partir do código real (`src/router/index.ts`, `src/config/app.ts`, `src/middlewares/*`,
    `src/entities/*/*.controller.ts` e `*.service.ts`). Pontos que o código deixa ambíguos estão marcados
    com `x-todo: confirmar` e explicados em `x-todo-detalhe`.

    ## Autenticação
    - Sessão por cookies `httpOnly`: `_tk` (JWT de acesso, claim `type: access`) e `_rtk` (refresh token
      opaco), gravados por `POST /auth/login` e rotacionados por `POST /auth/refresh-token`.
      `secure` + `SameSite=None` só com `NODE_ENV=production`; senão `SameSite=Lax`.
    - Rotas de empresa exigem o cookie `_tk` **e** o header `x-workspace-id` (= `empresa.identificador`);
      o middleware confere o vínculo do usuário em `empresaUsuarios`.
    - Exceções sem empresa (só `_tk`): `GET /auth/me`, `POST /empresas/create`,
      `POST /empresas/usuario/add/{email}`, `POST /convite/aceitar/{token}`.
    - Públicas: `/auth/login`, `/auth/register`, `/auth/refresh-token`, `/auth/logout`, `/auth/password-reset`,
      `/auth/password-reset-verify`, `/health` e `GET /convite/aceite/{token}`.
    - O perfil (`OWNER`, `ADMIN`, `COLAB`) é por empresa e vem do banco (não está no JWT). `COLAB` só vê e
      altera os próprios lançamentos e o que deriva deles; recurso fora do escopo responde 404.
    - `/api/*` aceita `Authorization: Bearer <apiKey>` (a `apiKey` devolvida por `GET /auth/me`, JWT sem
      expiração), copiado para o cookie `_tk`; o header `x-workspace-id` continua obrigatório.

    Falhas do middleware de autenticação (antes do controller), válidas para toda rota protegida:
    `401` "Token não fornecido" / "Token inválido" / "Token expirado"; `400` "Empresa não identificada."
    (sem `x-workspace-id`); `404` "Empresa não encontrada."; `403` "Usuário não pertence a esta empresa.";
    `500` "Erro na autenticação".

    ## Formato
    - Corpo de entrada em snake_case (exceções indicadas na operação); respostas em camelCase (algumas
      devolvem a linha do banco em snake_case, indicado no schema).
    - Sucesso: `{ "error": false, "data" | "message" }`. Erro: `{ "error": true, "message" }`.
    - **Atenção:** quando o service lança 404 (`AppError`), o controller responde **`error: false`** com
      status 404. O 404 do middleware de autenticação e o de rota inexistente respondem `error: true`.
    - JSON malformado → 400 "JSON inválido."; corpo acima de 1 MB → 413; rota inexistente → 404
      "Rota não encontrada."; erro não tratado → 500 "Erro interno." (sem stack nem SQL).
    - Toda resposta traz o header `X-Request-Id` (reaproveita o do cliente se casar com
      `^[A-Za-z0-9._:-]{1,100}$`; senão gera um UUID).
    - Horas são `Float` (horas decimais); totais formatados saem como `"HH:mm"`. `hora_inicio`/`hora_fim`
      são colunas `time` e saem como date-time em 1970-01-01 (ex.: `1970-01-01T08:00:00.000Z`).
    - Não há paginação nas listagens.

    ## Teste de carga
    Cada operação tem `x-load-weight` (`leitura`, `escrita` ou `pesado`) e, quando relevante, `x-load-note`.
    Rate limit em memória (vale para 1 processo PM2), responde 429 "Muitas tentativas. Tente novamente em
    alguns minutos.": login 10 falhas/15 min por IP; register 10/h por IP; password-reset 5/15 min por IP;
    password-reset-verify 10/15 min por IP; refresh-token 120/15 min por IP; convite/create 15/h por usuário.
servers:
  - url: http://localhost:{porta}
    description: Instância local. No PM2, 3001 = produção (NODE_ENV=production) e 3005 = homologação.
    variables:
      porta:
        default: '3001'
        enum:
          - '3001'
          - '3005'
    x-todo: confirmar
    x-todo-detalhe: URLs públicas de homologação e produção (atrás de proxy) não estão no código.
security:
  - cookieAuth: []
    workspaceId: []
tags:
  - name: auth
    description: Login, registro, sessão por cookies e recuperação de senha.
  - name: usuarios
    description: Usuários da empresa, perfil do usuário logado e estatísticas.
  - name: empresas
    description: Criação e exclusão de empresa e gestão de vínculos.
  - name: convite
    description: Convite por e-mail para entrar numa empresa.
  - name: clientes
    description: Clientes (modelo `parceiro`), com parceria opcional com outra empresa.
  - name: parceria
    description: Compartilhamento de projeto e atividades com a empresa parceira do cliente.
  - name: projetos
    description: Projetos de um cliente.
  - name: atividades
    description: Atividades de um projeto.
  - name: lancamentos
    description: Lançamentos de horas (timesheet).
  - name: despesas
    description: Despesas vinculadas a um lançamento de horas.
  - name: administrativo
    description: Férias, faltas e eventos.
  - name: dashboard
    description: Dados consolidados do painel.
  - name: relatorios
    description: Relatórios de lançamentos e despesas em JSON ou XLSX.
  - name: integracao
    description: API para integração externa autenticada por API key.
  - name: sistema
    description: Saúde do serviço.
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: _tk
      description: JWT de acesso gravado por `POST /auth/login` (validade `ACCESS_TOKEN_EXPIRES_IN`, padrão 15h).
    workspaceId:
      type: apiKey
      in: header
      name: x-workspace-id
      description: Identificador da empresa (`empresa.identificador`). O usuário precisa ter vínculo com ela.
    refreshCookie:
      type: apiKey
      in: cookie
      name: _rtk
      description: Refresh token opaco (validade `REFRESH_TOKEN_TTL_DAYS` dias, padrão 30); guardado como SHA-256.
    apiKeyBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: API key do usuário (campo `apiKey` de `GET /auth/me`). Aceita só em `/api/*`.
  headers:
    SetAuthCookies:
      description: Grava os cookies `_tk` e `_rtk` (`HttpOnly`; `Secure; SameSite=None` em produção, `SameSite=Lax` fora dela).
      schema:
        type: string
      example: _tk=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0eXBlIjoiYWNjZXNzIn0.sig; Max-Age=54000; Path=/; HttpOnly; SameSite=Lax
    ClearAuthCookies:
      description: Expira os cookies `_tk` e `_rtk`.
      schema:
        type: string
      example: _tk=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; SameSite=Lax
    RetryAfter:
      description: Segundos até a janela do rate limit reabrir.
      schema:
        type: integer
    ContentDisposition:
      description: Nome do arquivo gerado (exposto via `Access-Control-Expose-Headers`).
      schema:
        type: string
      example: attachment; filename="relatorio_lancamentos_1793622000000.xlsx"
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Id (uuid) do recurso.
      schema:
        $ref: '#/components/schemas/Uuid'
    RelatorioTipo:
      name: tipo
      in: query
      required: false
      description: '"despesas" gera relatório de despesas; ausente ou outro valor, de lançamentos.'
      schema:
        type: string
        enum: [despesas]
    RelatorioFilext:
      name: filext
      in: query
      required: false
      description: Com valor, devolve o arquivo em vez de JSON.
      schema:
        type: string
        enum: [xlsx, pdf]
  responses:
    BadRequest:
      description: Entrada inválida ou regra de negócio violada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: true
            message: Empresa não identificada.
    Unauthorized:
      description: Cookie `_tk` ausente, inválido ou expirado (ou credencial inválida).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: true
            message: Token não fornecido
    Forbidden:
      description: Usuário sem vínculo com a empresa do `x-workspace-id` ou sem permissão.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: true
            message: Usuário não pertence a esta empresa.
    NotFound:
      description: |
        Recurso inexistente ou fora do escopo do usuário. Quando vem do service, `error` é `false`
        (comportamento atual de `errorHandler`); quando vem do middleware (empresa do header), `error` é `true`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: false
            message: Recurso não encontrado.
    Conflict:
      description: Violação de unicidade.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: true
            message: CNPJ já existente
    TooManyRequests:
      description: Rate limit excedido.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: true
            message: Muitas tentativas. Tente novamente em alguns minutos.
    PayloadTooLarge:
      description: Corpo JSON acima de 1 MB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: true
            message: Corpo da requisição grande demais.
    InternalError:
      description: Erro interno (detalhe só no log, com o requestId).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: true
            message: Erro interno.
    RelatorioOk:
      description: Relatório gerado (JSON) ou arquivo (quando `filext` é enviado).
      headers:
        Content-Disposition:
          $ref: '#/components/headers/ContentDisposition'
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: boolean
                const: false
              data:
                oneOf:
                  - type: array
                    description: Lançamentos (padrão).
                    items:
                      $ref: '#/components/schemas/RelatorioLancamento'
                  - $ref: '#/components/schemas/RelatorioDespesas'
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
  requestBodies:
    RelatorioFiltros:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RelatorioFiltros'
          examples:
            lancamentosOutubro:
              summary: Lançamentos de outubro de um cliente, dois colaboradores
              value:
                data:
                  inicio: '2026-10-01'
                  fim: '2026-10-31'
                cliente:
                  inicio: Metalúrgica Vale
                  fim: Metalúrgica Vale
                colaboradores:
                  - 3f6c2a1e-8b4d-4c2f-9a7e-1d2b3c4d5e6f
                  - 7a8b9c0d-1e2f-4a3b-8c4d-5e6f7a8b9c0d
            semFiltro:
              summary: Sem filtros (tudo o que o perfil permite ver)
              value: {}
  schemas:
    Uuid:
      type: string
      format: uuid
      examples:
        - 3f6c2a1e-8b4d-4c2f-9a7e-1d2b3c4d5e6f
    HorasHHmm:
      type: string
      description: Horas decimais formatadas como `HH:mm` (pode ter sinal negativo e mais de 2 dígitos de hora).
      pattern: '^-?\d{2,}:\d{2}$'
      examples:
        - '89:30'
    HoraTime:
      type: string
      format: date-time
      description: Coluna `time` serializada como date-time em 1970-01-01 (UTC).
      examples:
        - '1970-01-01T08:00:00.000Z'
    HoraEntrada:
      type: string
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      description: Horário `HH:mm` (24h), interpretado em UTC sobre a data do lançamento.
      examples:
        - '08:00'
    Cargo:
      type: string
      enum: [OWNER, ADMIN, COLAB]
    StatusProjeto:
      type: string
      enum: [EmEspera, Orcando, EmAndamento, Finalizado, Cancelado]
    TipoProjeto:
      type: string
      enum: [SCC, ESTIMATIVA, ORCADO, INTERNO, CHAMADO, ESTUDO, AMS]
    Prioridade:
      type: string
      enum: [BAIXA, NORMAL, ALTA, CRITICA]
    TipoAtividade:
      type: string
      enum: [ESTIMATIVA, ORCADO, INTERNO, CHAMADO, ESTUDO, SCC]
    TipoAdministrativo:
      type: string
      enum: [FERIAS, FALTA, EVENTO]
    TipoLancamento:
      type: string
      enum: [MANUAL, CRONOMETRO]
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: boolean
          description: '`true` em erros; `false` nos 404 lançados pelo service (ver descrição geral).'
        message:
          type: string
    InviteErrorResponse:
      type: object
      required: [error, code, message]
      properties:
        error:
          type: boolean
          const: true
        code:
          type: string
          enum: [inviteInvalid, inviteExpired, inviteUnavailable, accountInactive, inviteAccountMismatch]
        message:
          type: string
    SuccessMessage:
      type: object
      required: [error, message]
      properties:
        error:
          type: boolean
          const: false
        message:
          type: string
    SuccessFlag:
      type: object
      required: [error]
      properties:
        error:
          type: boolean
          const: false
    MessageOnly:
      type: object
      description: Formato fora do padrão (sem o campo `error`), usado por `empresas`.
      required: [message]
      properties:
        message:
          type: string
    Me:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        apiKey:
          type: [string, 'null']
          description: JWT sem expiração para `/api/*`.
        email:
          type: [string, 'null']
          format: email
        isActive:
          type: boolean
        nomeCompleto:
          type: string
        nomeUsuario:
          type: string
        empresas:
          type: array
          items:
            type: object
            properties:
              nomeEmpresa:
                type: string
              identificador:
                type: string
              cargo:
                $ref: '#/components/schemas/Cargo'
    UsuarioListItem:
      type: object
      properties:
        usuarioId:
          $ref: '#/components/schemas/Uuid'
        nomeCompleto:
          type: string
        nomeUsuario:
          type: string
        email:
          type: [string, 'null']
        cargo:
          $ref: '#/components/schemas/Cargo'
        isActive:
          type: boolean
    UsuarioDetalhe:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nomeUsuario:
          type: string
        nomeCompleto:
          type: string
        email:
          type: [string, 'null']
        isActive:
          type: boolean
        cargo:
          $ref: '#/components/schemas/Cargo'
        projetos:
          type: array
          items:
            type: object
            properties:
              projetoId:
                $ref: '#/components/schemas/Uuid'
              projetoNome:
                type: string
              atividades:
                type: array
                items:
                  type: object
                  properties:
                    atividadeId:
                      $ref: '#/components/schemas/Uuid'
                    nomeAtividade:
                      type: string
        lancamentos:
          type: array
          description: Vazio quando um COLAB consulta um colega.
          items:
            type: object
            properties:
              lancamentoId:
                $ref: '#/components/schemas/Uuid'
              descricao:
                type: [string, 'null']
              duracaoTotal:
                type: number
              dataLancamento:
                type: string
                format: date-time
              horaInicio:
                $ref: '#/components/schemas/HoraTime'
              horaFim:
                $ref: '#/components/schemas/HoraTime'
              atividade:
                type: object
                properties:
                  atividadeId:
                    $ref: '#/components/schemas/Uuid'
                  nomeAtividade:
                    type: string
                  projeto:
                    type: object
                    properties:
                      projetoId:
                        $ref: '#/components/schemas/Uuid'
                      nomeProjeto:
                        type: string
    UsuarioStats:
      type: object
      properties:
        totalHorasLancadas:
          $ref: '#/components/schemas/HorasHHmm'
        totalLancamentos:
          type: integer
        totalProjetos:
          type: integer
        totalAtividades:
          type: integer
        horasPorProjeto:
          type: array
          items:
            type: object
            properties:
              projetoId:
                $ref: '#/components/schemas/Uuid'
              nomeProjeto:
                type: string
              totalHoras:
                type: number
    ClienteListItem:
      type: object
      properties:
        clienteId:
          $ref: '#/components/schemas/Uuid'
        nomeFantasia:
          type: [string, 'null']
        razaoSocial:
          type: string
        email:
          type: [string, 'null']
        localizacao:
          type: string
          description: '`cidade/UF`.'
        cnpj:
          type: string
        cep:
          type: [string, 'null']
        endereco:
          type: [string, 'null']
        projetos:
          type: integer
          description: Quantidade de projetos.
        status:
          type: boolean
    ClienteDetalhe:
      type: object
      properties:
        clienteId:
          $ref: '#/components/schemas/Uuid'
        nomeFantasia:
          type: [string, 'null']
        razaoSocial:
          type: [string, 'null']
          x-todo: confirmar
          x-todo-detalhe: O service preenche `razaoSocial` com `nome_fantasia`.
        inscricaoEstadual:
          type: [string, 'null']
        website:
          type: [string, 'null']
        notaInterna:
          type: [string, 'null']
          description: '`null` quando o cliente é visto pela empresa parceira.'
        pais:
          type: [string, 'null']
        email:
          type: [string, 'null']
        cidade:
          type: [string, 'null']
        estado:
          type: [string, 'null']
        cnpj:
          type: string
        cep:
          type: [string, 'null']
        endereco:
          type: [string, 'null']
        identificadorParceiro:
          type: [string, 'null']
        projetosNumero:
          type: integer
        status:
          type: boolean
        compartilhado:
          type: boolean
        projetos:
          type: array
          items:
            type: object
            properties:
              compartilhado:
                type: boolean
              projetoId:
                $ref: '#/components/schemas/Uuid'
              nomeProjeto:
                type: string
              horasPrevistas:
                type: [number, 'null']
              horasGastas:
                type: number
              statusLabel:
                type: string
              statusClass:
                type: string
        totalDespesas:
          type: number
        totalHorasGastas:
          $ref: '#/components/schemas/HorasHHmm'
    ParceiroRow:
      type: object
      description: Linha do modelo `parceiro` em snake_case.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        is_active:
          type: boolean
        criado_em:
          type: string
          format: date-time
        nome_fantasia:
          type: [string, 'null']
        razao_social:
          type: string
        email:
          type: [string, 'null']
        cnpj:
          type: string
        inscricao_estadual:
          type: [string, 'null']
        website:
          type: [string, 'null']
        nota_interna:
          type: [string, 'null']
        endereco:
          type: [string, 'null']
        estado:
          type: [string, 'null']
        cep:
          type: [string, 'null']
        pais:
          type: [string, 'null']
        cidade:
          type: [string, 'null']
        empresa_id:
          $ref: '#/components/schemas/Uuid'
        parceria_id:
          type: [integer, 'null']
    ProjetoRow:
      type: object
      description: Linha do modelo `projeto` em snake_case (campos principais).
      additionalProperties: true
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nome_projeto:
          type: string
        descricao:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/StatusProjeto'
        tipo:
          type: [string, 'null']
        horas_previstas:
          type: [number, 'null']
        horas_gastas:
          type: number
        data_inicio:
          type: [string, 'null']
          format: date-time
        data_fim:
          type: [string, 'null']
          format: date-time
        parceiro_id:
          $ref: '#/components/schemas/Uuid'
        empresa_id:
          $ref: '#/components/schemas/Uuid'
        compartilhado:
          type: boolean
        is_active:
          type: boolean
    ClienteInput:
      type: object
      properties:
        cnpj:
          type: string
        razao_social:
          type: string
        nome_fantasia:
          type: string
        email:
          type: string
          format: email
        cep:
          type: string
        endereco:
          type: string
        cidade:
          type: string
        estado:
          type: string
          maxLength: 2
        inscricao_estadual:
          type: string
        nota_interna:
          type: string
        pais:
          type: string
        website:
          type: string
    ProjetoListItem:
      type: object
      properties:
        projetoId:
          $ref: '#/components/schemas/Uuid'
        nomeProjeto:
          type: string
        razaoSocial:
          type: string
        status:
          $ref: '#/components/schemas/StatusProjeto'
        limiteAtingido:
          type: boolean
        refCliente:
          type: [string, 'null']
        horasGastas:
          type: number
        horasPrevistas:
          type: [number, 'null']
        dataInicio:
          type: [string, 'null']
          format: date-time
        dataFim:
          type: [string, 'null']
          format: date-time
        atividades:
          type: integer
        centroCusto:
          type: [string, 'null']
        solicitante:
          type: [string, 'null']
        tipoProjeto:
          type: [string, 'null']
        isActive:
          type: boolean
        compartilhado:
          type: boolean
    ProjetoDetalhe:
      type: object
      properties:
        projetoId:
          $ref: '#/components/schemas/Uuid'
        nomeProjeto:
          type: string
        refClienteProjeto:
          type: [string, 'null']
        descricao:
          type: [string, 'null']
        dataInicio:
          type: [string, 'null']
          format: date-time
        dataFim:
          type: [string, 'null']
          format: date-time
        compartilharComCliente:
          type: boolean
        horasGastas:
          type: number
        horasPrevistas:
          oneOf:
            - type: number
            - type: string
              const: Em Aberto
        nomeFantasia:
          type: [string, 'null']
        razaoSocial:
          type: string
        clienteId:
